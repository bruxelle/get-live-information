<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>myojou ライブ予定</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div class="topbar-copy">
          <p class="eyebrow">myojou live schedule</p>
          <h1>myojou ライブ予定</h1>
          <p class="topbar-subtitle">ライブ日・申込締切・チケット状況をまとめて確認できます。</p>
        </div>
        <div class="topbar-summary deadline-status" aria-label="締切状況">
          <div id="deadlineStatusList" class="deadline-status-list"></div>
          <p id="deadlineStatusEmpty" class="deadline-status-empty" hidden>直近の締切なし</p>
        </div>
      </header>

      <section class="controls-panel" aria-label="表示設定">
        <nav class="view-switcher" aria-label="表示切り替え">
          <button class="view-button" type="button" data-view="cards" aria-pressed="false">カード</button>
          <button class="view-button is-active" type="button" data-view="calendar" aria-pressed="true">カレンダー</button>
        </nav>

        <div class="card-controls" aria-label="カード表示の絞り込みと並び替え">
          <nav class="filters" aria-label="日付フィルター">
            <button class="filter-button is-active" type="button" data-filter="upcoming">今日以降</button>
            <button class="filter-button" type="button" data-filter="week">今週</button>
            <button class="filter-button" type="button" data-filter="month">今月</button>
            <button class="filter-button" type="button" data-filter="missing-deadline">締切未取得</button>
            <button class="filter-button" type="button" data-filter="all">すべて</button>
          </nav>

          <nav class="sort-controls" aria-label="並び替え">
            <button class="sort-button is-active" type="button" data-sort="event-date">ライブ日順</button>
            <button class="sort-button" type="button" data-sort="deadline">申込締切順</button>
          </nav>
        </div>
      </section>

      <section id="calendarView" class="calendar-view">
        <section class="calendar-controls" aria-label="カレンダー操作">
          <nav class="calendar-mode-controls" aria-label="カレンダー表示モード">
            <button class="calendar-mode-button is-active" type="button" data-calendar-mode="live" aria-pressed="true">ライブ日</button>
            <button class="calendar-mode-button" type="button" data-calendar-mode="lotteryDeadline" aria-pressed="false">抽選締切</button>
            <button class="calendar-mode-button" type="button" data-calendar-mode="firstComeDeadline" aria-pressed="false">先着締切</button>
          </nav>
        </section>

        <div id="calendarMonths" class="calendar-months" aria-label="ライブ・締切カレンダー"></div>
      </section>

      <section id="eventList" class="event-list" aria-live="polite" hidden></section>
      <p id="emptyState" class="empty-state" hidden>表示できる予定がありません。</p>
    </main>

    <script src="calendar_helpers.js?v=calendar-switch-fix-20260629"></script>
    <script src="app.js?v=calendar-initial-render-20260630"></script>
  </body>
</html>
